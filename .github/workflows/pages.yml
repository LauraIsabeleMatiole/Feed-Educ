# Publica no GitHub Pages:
#   /            -> landing page (branch landingpage)
#   /sistema/    -> telas do sistema (pasta frontEnd da main)
name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'FeedEduc/src/main/java/com/projeto/feededuc/frontEnd/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar a main (telas do sistema)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Baixar a landing page
        uses: actions/checkout@v4
        with:
          ref: landingpage
          path: landing

      - name: Montar o site
        run: |
          mkdir -p site/sistema
          rsync -a --exclude '.git' landing/ site/
          rsync -a main/FeedEduc/src/main/java/com/projeto/feededuc/frontEnd/ site/sistema/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
