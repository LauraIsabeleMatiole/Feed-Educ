# Publica as telas (HTML/CSS/JS/imagens) no GitHub Pages a cada push na main.
name: Publicar telas no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'FeedEduc/src/main/java/com/projeto/feededuc/frontEnd/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FeedEduc/src/main/java/com/projeto/feededuc/frontEnd
      - id: deployment
        uses: actions/deploy-pages@v4
