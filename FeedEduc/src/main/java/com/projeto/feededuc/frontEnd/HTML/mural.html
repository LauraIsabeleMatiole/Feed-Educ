<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedEduc - Mural de Feedbacks</title>
    <link rel="icon" type="image/x-icon" href="../IMAGE/logo sem fundo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/mural.css?v=2">
</head>
<body>
    <header role="banner">
        <div class="logo-container">
            <img src="../IMAGE/logo sem fundo.png" alt="Abrir menu do FeedEduc" class="logo" id="menu-toggle" aria-haspopup="true" aria-expanded="false">
            <div id="dropdown-menu" class="dropdown-menu">
                <a href="telaInicial.html">Início</a>
                <a href="Feedback.html">Novo feedback</a>
                <a href="mural.html">Mural</a>
                <button type="button" onclick="fazerLogout()">🚪 Sair</button>
            </div>
        </div>
        <nav role="navigation" aria-label="Navegação principal">
            <a href="telaInicial.html">Início</a>
            <a href="Feedback.html">Feedback</a>
            <a href="mural.html" aria-current="page">Mural</a>
        </nav>
        <div class="user-area">
            <div class="user-chip">
                <strong id="user-login"></strong>
                <span id="user-role"></span>
            </div>
            <button type="button" class="header-logout" onclick="fazerLogout()">Sair</button>
        </div>
    </header>

    <main class="mural-main" role="main">
        <div class="page-head">
            <div>
                <h1 class="page-title">Mural de feedbacks</h1>
                <p class="page-subtitle" id="page-subtitle">Acompanhe o que a comunidade escolar está dizendo.</p>
            </div>
            <a href="Feedback.html" class="btn-primary" id="cta-feedback">+ Novo feedback</a>
        </div>

        <div class="filters" role="search">
            <div>
                <label for="filter-busca">Buscar</label>
                <input type="text" id="filter-busca" placeholder="Título ou descrição…" autocomplete="off">
            </div>
            <div>
                <label for="filter-setor">Setor</label>
                <select id="filter-setor">
                    <option value="">Todos</option>
                </select>
            </div>
            <div>
                <label for="filter-status">Status</label>
                <select id="filter-status">
                    <option value="">Todos</option>
                    <option value="EM_ABERTO">Em aberto</option>
                    <option value="EM_ANALISE">Em análise</option>
                    <option value="RESOLVIDO">Resolvido</option>
                </select>
            </div>
            <div>
                <label for="filter-privacidade">Visibilidade</label>
                <select id="filter-privacidade">
                    <option value="">Todas</option>
                    <option value="publico">Público</option>
                    <option value="privado">Privado</option>
                </select>
            </div>
        </div>

        <p class="result-count" id="result-count" aria-live="polite"></p>

        <div id="mural-container" class="mural-grid" role="region" aria-label="Mural de feedbacks">
            <div class="list-message">Carregando feedbacks…</div>
        </div>
    </main>

    <!-- VLibras Widget -->
    <div vw class="enabled" role="complementary" aria-label="Tradutor VLibras">
        <div vw-access-button class="active" aria-label="Abrir tradutor VLibras"></div>
        <div vw-plugin-wrapper>
          <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <!-- UserWay Widget -->
    <script>
        (function(d){
            var s = d.createElement("script");
            s.setAttribute("data-account", "USERWAY_ACCOUNT_ID");
            s.setAttribute("data-language", "pt-br");
            s.setAttribute("data-position", "top-right");
            s.setAttribute("data-background", "#005792");
            s.setAttribute("data-size", "48px");
            s.setAttribute("data-mobile", "true");
            s.setAttribute("data-hide-mobile", "false");
            s.setAttribute("data-close-esc", "true");
            s.setAttribute("data-close-outside", "true");
            s.src = "https://cdn.userway.org/widget.js";
            (d.body || d.head).appendChild(s);
        })(document);
    </script>

    <script>
        const BACKEND_URL = 'http://localhost:8080';

        const NOMES_TIPO = {
            ADMINISTRADOR: 'Administrador',
            ALUNO: 'Aluno',
            PROFESSOR: 'Professor',
            COORDENADOR: 'Coordenação',
            SETOR_APOIO: 'Setor de apoio',
            OPP: 'OPP',
            LIMPEZA: 'Limpeza',
            CANTINA: 'Cantina',
            MANUTENCAO: 'Manutenção',
            REFEITORIO: 'Refeitório',
            AUDITORIO: 'Auditório',
            SALAS_DE_AULA: 'Salas de aula'
        };

        const NOMES_STATUS = {
            EM_ABERTO: 'Em aberto',
            EM_ANALISE: 'Em análise',
            RESOLVIDO: 'Resolvido'
        };

        const usuario = {
            token: sessionStorage.getItem('userToken'),
            role: sessionStorage.getItem('userRole') || '',
            login: sessionStorage.getItem('userLogin') || ''
        };

        let todosFeedbacks = [];

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.textContent = texto ?? '';
            return div.innerHTML;
        }

        function formatarData(iso) {
            if (!iso) return '';
            const data = new Date(iso);
            return isNaN(data) ? '' : data.toLocaleDateString('pt-BR');
        }

        function nomeSetor(fb) {
            return NOMES_TIPO[fb.destinatario] || fb.destinatarioEspecifico || 'Geral';
        }

        function mostrarAviso(mensagem, tipo) {
            const div = document.createElement('div');
            div.className = `toast toast-${tipo}`;
            div.setAttribute('role', 'status');
            div.textContent = mensagem;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), tipo === 'error' ? 5000 : 3000);
        }

        // Mesmas regras do FeedbackController (podeResponderFeedback / podeAlterarStatus)
        function podeAlterarStatus(fb) {
            if (usuario.role === 'ADMINISTRADOR') return true;
            if (fb.destinatarioEspecifico) return fb.destinatarioEspecifico === usuario.login;
            return usuario.role === fb.destinatario;
        }

        function podeResponder(fb) {
            if (fb.status === 'RESOLVIDO') return false;
            return fb.alunoId === usuario.login || podeAlterarStatus(fb);
        }

        async function api(caminho, opcoes = {}) {
            const response = await fetch(`${BACKEND_URL}${caminho}`, {
                ...opcoes,
                headers: {
                    'Authorization': `Bearer ${usuario.token}`,
                    ...(opcoes.body ? { 'Content-Type': 'application/json' } : {})
                }
            });
            if (response.status === 401) {
                alert('Sua sessão expirou. Faça login novamente.');
                sessionStorage.clear();
                window.location.href = 'login_cpf.html';
                throw new Error('Sessão expirada');
            }
            if (!response.ok) {
                throw new Error((await response.text()) || `Erro ${response.status}`);
            }
            return response.json();
        }

        async function carregarFeedbacks() {
            // Públicos para todos; o aluno soma os próprios e os demais somam os que receberam
            const rotaExtra = usuario.role === 'ALUNO' ? '/api/feedbacks/meus-feedbacks' : '/api/feedbacks/recebidos';
            const [publicos, extras] = await Promise.all([api('/api/feedbacks'), api(rotaExtra)]);

            const porId = new Map();
            [...publicos, ...extras].forEach(fb => porId.set(fb.id, fb));
            todosFeedbacks = [...porId.values()].sort((a, b) => new Date(b.dataEnvio) - new Date(a.dataEnvio));

            preencherFiltroSetor();
            aplicarFiltros();
        }

        function preencherFiltroSetor() {
            const select = document.getElementById('filter-setor');
            const atual = select.value;
            const setores = [...new Set(todosFeedbacks.map(nomeSetor))].sort();
            select.innerHTML = '<option value="">Todos</option>' +
                setores.map(s => `<option value="${escaparHtml(s)}">${escaparHtml(s)}</option>`).join('');
            select.value = setores.includes(atual) ? atual : '';
        }

        function aplicarFiltros() {
            const busca = document.getElementById('filter-busca').value.trim().toLowerCase();
            const setor = document.getElementById('filter-setor').value;
            const status = document.getElementById('filter-status').value;
            const privacidade = document.getElementById('filter-privacidade').value;

            const filtrados = todosFeedbacks.filter(fb =>
                (!busca || `${fb.titulo} ${fb.conteudo}`.toLowerCase().includes(busca)) &&
                (!setor || nomeSetor(fb) === setor) &&
                (!status || fb.status === status) &&
                (!privacidade || (privacidade === 'publico') === fb.publico)
            );

            exibirFeedbacks(filtrados);
        }

        function exibirFeedbacks(feedbacks) {
            const container = document.getElementById('mural-container');
            const contador = document.getElementById('result-count');

            contador.textContent = todosFeedbacks.length
                ? `${feedbacks.length} de ${todosFeedbacks.length} feedback${todosFeedbacks.length > 1 ? 's' : ''}`
                : '';

            if (!todosFeedbacks.length) {
                container.innerHTML = `
                    <div class="list-message">
                        Ainda não há feedbacks para mostrar.
                        ${usuario.role === 'ALUNO' ? '<br><a href="Feedback.html" class="btn-primary">Enviar o primeiro</a>' : ''}
                    </div>`;
                return;
            }

            if (!feedbacks.length) {
                container.innerHTML = '<div class="list-message">Nenhum feedback corresponde aos filtros.</div>';
                return;
            }

            container.innerHTML = feedbacks.map(criarCartao).join('');
        }

        function criarCartao(fb) {
            const status = NOMES_STATUS[fb.status] ? fb.status : 'EM_ABERTO';
            const isProprio = fb.alunoId === usuario.login;
            const longo = (fb.conteudo || '').length > 220;

            const respostas = (fb.respostas || []).map(r => `
                <div class="response">
                    <div class="response-head">
                        ${escaparHtml(r.responsavelNome || r.responsavelId || 'Responsável')}
                        · ${formatarData(r.dataResposta)}
                    </div>
                    <p>${escaparHtml(r.conteudo)}</p>
                </div>`).join('');

            const acoes = [];
            if (podeResponder(fb)) {
                acoes.push(`<button type="button" class="action-btn" onclick="alternarForm(${fb.id}, 'reply')">💬 Responder</button>`);
            }
            if (podeAlterarStatus(fb)) {
                acoes.push(`<button type="button" class="action-btn" onclick="alternarForm(${fb.id}, 'status')">🔄 Alterar status</button>`);
            }

            const formularios = `
                <form class="reply-form" id="reply-${fb.id}" onsubmit="enviarResposta(event, ${fb.id})">
                    <textarea required placeholder="Escreva sua resposta…" aria-label="Resposta"></textarea>
                    <div class="form-row">
                        <button type="submit" class="btn-primary">Enviar resposta</button>
                        <button type="button" class="action-btn" onclick="alternarForm(${fb.id}, 'reply')">Cancelar</button>
                    </div>
                </form>
                <form class="status-form" id="status-${fb.id}" onsubmit="enviarStatus(event, ${fb.id})">
                    <select aria-label="Novo status">
                        ${Object.entries(NOMES_STATUS).map(([valor, nome]) =>
                            `<option value="${valor}" ${valor === status ? 'selected' : ''}>${nome}</option>`).join('')}
                    </select>
                    <div class="form-row">
                        <button type="submit" class="btn-primary">Salvar status</button>
                        <button type="button" class="action-btn" onclick="alternarForm(${fb.id}, 'status')">Cancelar</button>
                    </div>
                </form>`;

            return `
                <article class="feedback-card ${isProprio ? 'is-own' : ''}">
                    <div class="card-badges">
                        <span class="badge badge-status-${status}">${NOMES_STATUS[status]}</span>
                        <span class="badge badge-neutral">${fb.publico ? '🌐 Público' : '🔒 Privado'}</span>
                        ${isProprio ? '<span class="badge badge-own">✍️ Seu feedback</span>' : ''}
                    </div>
                    <h2>${escaparHtml(fb.titulo || 'Sem título')}</h2>
                    <p class="card-text ${longo ? 'clamped' : ''}" id="texto-${fb.id}">${escaparHtml(fb.conteudo)}</p>
                    ${longo ? `<button type="button" class="link-btn" onclick="alternarTexto(this, ${fb.id})">Ver mais</button>` : ''}
                    <div class="card-meta">
                        <span>📍 Para: ${escaparHtml(nomeSetor(fb))}</span>
                        <span>📅 ${formatarData(fb.dataEnvio)}</span>
                    </div>
                    ${respostas ? `<div class="responses">${respostas}</div>` : ''}
                    ${acoes.length ? `<div class="card-actions">${acoes.join('')}${formularios}</div>` : ''}
                </article>`;
        }

        function alternarTexto(botao, id) {
            const texto = document.getElementById(`texto-${id}`);
            const recolhido = texto.classList.toggle('clamped');
            botao.textContent = recolhido ? 'Ver mais' : 'Ver menos';
        }

        function alternarForm(id, tipo) {
            const form = document.getElementById(`${tipo}-${id}`);
            const abrir = !form.classList.contains('open');
            form.classList.toggle('open', abrir);
            if (abrir) form.querySelector('textarea, select').focus();
        }

        async function enviarResposta(event, id) {
            event.preventDefault();
            const conteudo = event.target.querySelector('textarea').value.trim();
            if (!conteudo) return;
            try {
                await api(`/api/feedbacks/${id}/responder`, {
                    method: 'POST',
                    body: JSON.stringify({ conteudo })
                });
                mostrarAviso('Resposta enviada!', 'success');
                await carregarFeedbacks();
            } catch (error) {
                mostrarAviso('Erro ao responder: ' + error.message, 'error');
            }
        }

        async function enviarStatus(event, id) {
            event.preventDefault();
            const status = event.target.querySelector('select').value;
            try {
                await api(`/api/feedbacks/${id}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ status })
                });
                mostrarAviso('Status atualizado!', 'success');
                await carregarFeedbacks();
            } catch (error) {
                mostrarAviso('Erro ao alterar status: ' + error.message, 'error');
            }
        }

        function fazerLogout() {
            if (!confirm('Deseja realmente sair?')) return;
            sessionStorage.removeItem('userToken');
            sessionStorage.removeItem('userRole');
            sessionStorage.removeItem('userId');
            sessionStorage.removeItem('userLogin');
            window.location.href = 'login_cpf.html';
        }

        // Menu do logo
        const menuToggle = document.getElementById('menu-toggle');
        const dropdownMenu = document.getElementById('dropdown-menu');

        menuToggle.addEventListener('click', () => {
            const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
            menuToggle.setAttribute('aria-expanded', !isExpanded);
            dropdownMenu.style.display = isExpanded ? 'none' : 'flex';
        });

        document.addEventListener('click', (event) => {
            if (!menuToggle.contains(event.target) && !dropdownMenu.contains(event.target)) {
                dropdownMenu.style.display = 'none';
                menuToggle.setAttribute('aria-expanded', 'false');
            }
        });

        // Inicialização
        if (!usuario.token) {
            alert('Você precisa fazer login para acessar esta página.');
            window.location.href = 'login_cpf.html';
        } else {
            document.getElementById('user-login').textContent = usuario.login;
            document.getElementById('user-role').textContent = NOMES_TIPO[usuario.role] || usuario.role;

            if (usuario.role !== 'ALUNO') {
                document.getElementById('cta-feedback').remove();
                document.getElementById('page-subtitle').textContent =
                    'Feedbacks públicos e os que foram enviados para você.';
            } else {
                document.getElementById('page-subtitle').textContent =
                    'Feedbacks públicos da escola e todos os que você enviou.';
            }

            ['filter-busca', 'filter-setor', 'filter-status', 'filter-privacidade'].forEach(id => {
                document.getElementById(id).addEventListener(id === 'filter-busca' ? 'input' : 'change', aplicarFiltros);
            });

            carregarFeedbacks().catch(error => {
                console.error('Erro ao carregar feedbacks:', error);
                document.getElementById('mural-container').innerHTML =
                    '<div class="list-message">Não foi possível carregar os feedbacks. Verifique se o servidor está rodando.</div>';
            });
        }
    </script>
</body>
</html>
