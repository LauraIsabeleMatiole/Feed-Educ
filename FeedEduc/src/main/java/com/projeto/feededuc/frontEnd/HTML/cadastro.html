<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedEduc - Cadastro</title>
    <link rel="stylesheet" href="../CSS/cadastro.css?v=2">
    <link rel="icon" type="image/x-icon" href="../IMAGE/logo sem fundo.png">
</head>

<body>
<main role="main">
    <div class="container">
        <h1>Cadastro</h1>

        <div id="acesso-negado" style="display: none; background: #fff3e0; color: #5d4037; padding: 15px; border-radius: 5px; margin: 15px 0;">
            <p><strong>Apenas administradores podem cadastrar usuários.</strong></p>
            <p>Entre como administrador nesta mesma aba e abra o cadastro pela tela inicial.</p>
            <p><a href="login_cpf.html">Ir para o login</a></p>
        </div>

        <form id="register-form" role="form" aria-label="Formulário de cadastro">
            <label for="tipoUsuarioSelect">Tipo de usuário</label>
            <select id="tipoUsuarioSelect" name="tipoUsuario">
                <option value="ALUNO">Aluno</option>
                <option value="PROFESSOR">Professor</option>
                <option value="LIMPEZA">Limpeza</option>
                <option value="MANUTENCAO">Manutenção</option>
                <option value="OPP">OPP</option>
                <option value="SETOR_APOIO">Setor de Apoio</option>
                <option value="COORDENADOR">Coordenador</option>
                <option value="CANTINA">Cantina</option>
                <option value="REFEITORIO">Refeitório</option>
                <option value="AUDITORIO">Auditório</option>
                <option value="SALAS_DE_AULA">Salas de aula</option>
                <option value="ADMINISTRADOR">Administrador</option>
            </select>

            <input type="text" id="login" placeholder="Login (CPF/Matrícula)" required>
            <input type="text" id="nome" placeholder="Nome" required>
            <input type="text" id="sobrenome" placeholder="Sobrenome" required>
            <input type="text" id="cpf" placeholder="CPF (11 dígitos)" required pattern="[0-9]{11}">

            <button type="submit">Criar conta</button>
        </form>

        <div id="error-message" style="color: red; display: none;"></div>
        <div id="success-message" style="color: green; display: none;"></div>

        <p style="margin-top: 15px;"><a href="telaInicial.html">← Voltar para a tela inicial</a></p>
    </div>
</main>

<script>
    const BACKEND_URL = 'http://localhost:8080';

    // Só o administrador logado nesta aba pode cadastrar usuários
    const token = sessionStorage.getItem('userToken');
    const isAdmin = token && sessionStorage.getItem('userRole') === 'ADMINISTRADOR';

    if (!isAdmin) {
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('acesso-negado').style.display = 'block';
    }

    document.getElementById('register-form').addEventListener('submit', async function(event) {
        event.preventDefault();

        const login = document.getElementById('login').value.trim();
        const nome = document.getElementById('nome').value.trim();
        const sobrenome = document.getElementById('sobrenome').value.trim();
        const cpf = document.getElementById('cpf').value.trim();
        const tipoUsuario = document.getElementById('tipoUsuarioSelect').value;

        if (!login) {
            showError("Login é obrigatório.");
            return;
        }

        if (!nome) {
            showError("Nome é obrigatório.");
            return;
        }

        if (!sobrenome) {
            showError("Sobrenome é obrigatório.");
            return;
        }

        if (!cpf || cpf.length !== 11) {
            showError("CPF deve conter 11 dígitos.");
            return;
        }

        const userData = {
            login: login,
            nome: nome,
            sobrenome: sobrenome,
            cpf: cpf,
            tipoUsuario: tipoUsuario
        };

        try {
            const response = await fetch(`${BACKEND_URL}/api/usuarios`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(userData)
            });

            if (response.ok) {
                const result = await response.json();
                showSuccess(`
                    ✅ Cadastro realizado com sucesso!<br>
                    <strong>Nome:</strong> ${escaparHtml(result.nome)} ${escaparHtml(sobrenome)}<br>
                    <strong>Login:</strong> ${escaparHtml(result.login)}<br>
                    <strong>Tipo:</strong> ${escaparHtml(result.tipoUsuario)}<br>
                    <strong>Senha temporária:</strong> mudar123
                `);
                document.getElementById('register-form').reset();
            } else if (response.status === 401 || response.status === 403) {
                showError('Sua sessão expirou. Entre novamente como administrador.');
            } else {
                let errorMsg = `Erro ${response.status}: ${response.statusText}`;
                try {
                    const errorData = await response.json();
                    errorMsg = errorData.error || errorMsg;
                } catch (e) {
                    // Ignora erro de parse
                }
                showError(escaparHtml(errorMsg));
            }
        } catch (error) {
            console.error('💥 Erro de rede:', error);
            showError(`Erro de conexão: ${escaparHtml(error.message)}`);
        }
    });

    function escaparHtml(texto) {
        const div = document.createElement('div');
        div.textContent = texto ?? '';
        return div.innerHTML;
    }

    function showError(message) {
        const errorElement = document.getElementById('error-message');
        errorElement.innerHTML = message;
        errorElement.style.display = 'block';
        document.getElementById('success-message').style.display = 'none';

        errorElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function showSuccess(message) {
        const successElement = document.getElementById('success-message');
        successElement.innerHTML = message;
        successElement.style.display = 'block';
        document.getElementById('error-message').style.display = 'none';

        successElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Máscara CPF
    document.getElementById('cpf').addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '').substring(0, 11);
    });

    document.getElementById('cpf').addEventListener('blur', function() {
        const loginField = document.getElementById('login');
        if (this.value && !loginField.value) {
            loginField.value = this.value;
        }
    });
</script>
    <!-- VLibras Widget -->
    <div vw class="enabled" role="complementary" aria-label="Tradutor VLibras">
        <div vw-access-button class="active" aria-label="Abrir tradutor VLibras"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        if (window.VLibras) {
            try { new window.VLibras.Widget('https://vlibras.gov.br/app'); } catch(e){ console.error('Erro ao iniciar VLibras:', e); }
        } else {
            const s = document.createElement('script');
            s.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
            s.onload = function(){ try { new window.VLibras.Widget('https://vlibras.gov.br/app'); } catch(e){ console.error(e); } };
            document.body.appendChild(s);
        }
    </script>
</body>
</html>
