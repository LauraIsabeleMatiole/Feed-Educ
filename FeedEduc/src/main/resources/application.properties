spring.application.name=feededuc

# application.properties
# Cada valor pode ser trocado por uma variável de ambiente (usado na hospedagem).
# Sem a variável, vale o padrão depois dos dois-pontos (MySQL local).
# spring.datasource.url=jdbc:mysql://localhost:3306/oficina?createDatabaseIfNotExist=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/feed_educ_v9?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&defaultRowPrefetch=1&useUnicode=true&characterEncoding=UTF-8&useTimezone=true&useLegacyDatetimeCode=false&authenticationMethod=mysql_native_password}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:aluno}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Para exibir as queries SQL no console (útil para desenvolvimento)
spring.jpa.show-sql=${SHOW_SQL:true}
# Propriedade de segurança obrigatória para geração e validação de tokens JWT.
# Na hospedagem, defina JWT_SECRET com uma chave própria: esta aqui é pública no GitHub.
api.security.token.secret=${JWT_SECRET:SuaChaveSecretaMuitoLongaEComplexaComMaisDe32Caracteres}
server.port=${PORT:8080}
